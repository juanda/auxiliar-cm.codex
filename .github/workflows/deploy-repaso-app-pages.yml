name: Publicar repaso-app en GitHub Pages

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el contenido a publicar
        run: |
          set -e
          mkdir -p site/repaso-app site/08_flashcards site/07_tests
          cp repaso-app/index.html repaso-app/style.css repaso-app/common.js repaso-app/flashcards.js repaso-app/quiz.js site/repaso-app/
          cp 08_flashcards/*.csv site/08_flashcards/
          cp 07_tests/*.md site/07_tests/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
